# Round-robin across both instances. No sticky sessions on purpose — if the app
# needs them, that is a finding, not a config to add here.
upstream app {
    server app-1:8000;
    server app-2:8000;
}
server {
    listen 80;
    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
