name: claude
# @claude in an issue or comment → Claude works the item and opens a PR.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: contains(github.event.comment.body || github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Follow CLAUDE.md and everything in .claude/rules/.
            Run the project verify command before opening a PR.
            Meet the Definition of Done in docs/DEFINITION.md.
            Include the rollback step in the PR description.
            If the issue needs a spec (medium or large), say so and stop
            instead of guessing at scope.
