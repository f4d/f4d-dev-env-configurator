name: notion-sync
# Mirrors GitHub engineering state into the company Work DB in Notion.
# One direction. Never writes triage fields.

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, closed, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  # Serialize every run for the repo behind one key. A PR event and the
  # issues.closed event it triggers by closing a linked issue carry
  # different numbers (github.event.pull_request.number vs
  # github.event.issue.number), so a per-number key lets them race on the
  # same Notion row instead of queueing behind each other. This sync is
  # low-volume (issue/PR events only), so losing per-issue parallelism
  # costs nothing real.
  group: notion-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_WORK_DB: ${{ vars.NOTION_WORK_DB }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/notion_sync.py
