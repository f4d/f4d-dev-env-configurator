name: gates
# The kit running its own gates. Until this existed, f4d-kit shipped gates.yml
# to every scaffolded repo and ran none of them on itself — the registry claimed
# enforcement the kit did not apply to its own PRs (§7.6). check_commits.py and
# check_test_count.py in particular had NEVER run here, because both need
# BASE_REF and only CI supplies it.
#
# Note the path difference from templates/github/gates.yml: scaffolded repos get
# the checks copied to .github/scripts/, but this repo IS the source, so they run
# from scripts/.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  harnesses:
    name: "harnesses — 133 tests across 6 suites"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore executable bits
        # Rule 0 of this repo: a hook that is not executable fails SILENTLY.
        run: chmod +x hooks/*.sh tests/*.sh bootstrap.sh
      - name: Run all six harnesses
        run: |
          fail=0
          for t in hooks render_registry gate_trio statelessness conformance companions; do
            echo "::group::${t}_test.sh"
            bash "tests/${t}_test.sh" || fail=1
            echo "::endgroup::"
          done
          exit $fail

  gates:
    name: "registry gates — every check script, against the kit itself"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # A7: one checkout, one python setup, all checks. Each names the rule IDs
      # it enforces so a failure is traceable to REGISTRY.md.
      - name: Run all registry gates
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          fail=0
          run() {
            echo "::group::$1"
            python "scripts/$1" || fail=1
            echo "::endgroup::"
          }
          run check_commits.py         # C-06  <- needs BASE_REF; never ran here before
          run check_test_count.py      # C-08  <- needs BASE_REF; never ran here before
          run check_fixtures.py        # I-02 I-03 G-05
          run check_rollback.py        # O-02 O-03 D-05
          run check_contract_pin.py    # K-02 K-03
          run check_guess_lists.py     # S-05
          run check_statelessness.py   # ST-01..ST-07
          run check_catch_empty.py     # S-03
          run check_log_hygiene.py     # O-05
          run check_raw_sql.py         # D-06
          run check_pure_imports.py    # S-07
          exit $fail

# Registry resolution (A9 — IDs are permanent, every reference must resolve) is
# NOT a job here: conformance_test.sh already builds a temp manifest per registry
# section and runs render_registry.py --validate against each, and the harnesses
# job runs it. Adding a second copy would be S-05 in the CI layer. Note that
# `--validate` cannot run against this repo directly — it needs a manifest, and
# the kit is the registry's source, not a consumer of it.
